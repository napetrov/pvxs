name: Capture ABICheck baseline-set

# This trusted, reusable lifecycle entry point captures both public PVXS DSOs
# together.  Call it only after accepting a revision; it is intentionally not
# triggered by pull_request and does not write refs, releases, or comments.
on:
  workflow_call:
    inputs:
      project-ref:
        required: true
        type: string
      baseline-generation:
        required: false
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      project-ref:
        description: Label recorded in the baseline manifest
        required: true
        default: main
      baseline-generation:
        description: ABICheck baseline schema/fact generation
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install build dependencies
        run: python .ci/cue.py prepare
      - name: Build and stage installed PVXS artifacts
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ioc
          make -j2 install INSTALL_LOCATION="$RUNNER_TEMP/pvxs-baseline"
          .github/workflows/abicheck-stage-installed.sh "$RUNNER_TEMP/pvxs-baseline" "$RUNNER_TEMP/abicheck-baseline-input"
      - name: Capture reusable baseline-set
        uses: abicheck/abicheck/actions/baseline@fb423dfd62c267b0db61739941f2d35ee2dacb16
        with:
          libraries: >-
            [{"name":"libpvxs","artifact":"${{ runner.temp }}/abicheck-baseline-input/lib/libpvxs.so","header":"${{ runner.temp }}/abicheck-baseline-input/include/pvxs","include":"${{ runner.temp }}/abicheck-baseline-input/include ${{ runner.temp }}/abicheck-baseline-input/epics/include ${{ runner.temp }}/abicheck-baseline-input/epics/include/os/Linux ${{ runner.temp }}/abicheck-baseline-input/epics/include/compiler/gcc","stage_binary":true},{"name":"libpvxsIoc","artifact":"${{ runner.temp }}/abicheck-baseline-input/lib/libpvxsIoc.so","header":"${{ runner.temp }}/abicheck-baseline-input/include/pvxs/iochooks.h","include":"${{ runner.temp }}/abicheck-baseline-input/include ${{ runner.temp }}/abicheck-baseline-input/epics/include ${{ runner.temp }}/abicheck-baseline-input/epics/include/os/Linux ${{ runner.temp }}/abicheck-baseline-input/epics/include/compiler/gcc","stage_binary":true}]
          output-dir: abicheck-baseline
          project-ref: ${{ inputs.project-ref || github.sha }}
          profile: linux-x86_64-gcc
          depth: headers
          baseline-generation: ${{ inputs.baseline-generation || '1' }}
      - name: Upload baseline-set for trusted promotion
        uses: actions/upload-artifact@v7
        with:
          name: abicheck-baseline-set
          path: abicheck-baseline
          retention-days: 90
          if-no-files-found: error
